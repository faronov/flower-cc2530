name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host:
    name: Host tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {submodules: true, persist-credentials: false}
      - run: make test

  firmware:
    name: LLVM MCS-51 firmware
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {submodules: true, persist-credentials: false}

      - name: Read the stack's compiler pin
        id: pin
        run: |
          python3 - >> "$GITHUB_OUTPUT" <<'PY'
          import json
          pin = json.load(open("cc2530-zigbee/tools/llvm/toolchain.json"))
          print("repository=" + pin["repository"])
          print("revision=" + pin["revision"])
          PY

      # The prebuilt toolchain release of the pinned compiler revision.
      - name: Download LLVM-MCS51
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ steps.pin.outputs.repository }}
          REVISION: ${{ steps.pin.outputs.revision }}
        run: |
          set -euo pipefail
          tag=$(gh api "repos/$REPOSITORY/releases" --paginate --jq '.[].tag_name' |
                grep -x "mcs51-llvm-.*-${REVISION:0:12}" | head -n 1)
          test -n "$tag" || { echo "no release for $REVISION"; exit 1; }
          dir="$RUNNER_TEMP/mcs51"
          gh release download "$tag" -R "$REPOSITORY" -D "$dir" \
            -p "$tag-linux-amd64.tar.gz" -p SHA256SUMS
          (cd "$dir" && sha256sum --check --ignore-missing SHA256SUMS && tar -xzf "$tag-linux-amd64.tar.gz")
          python3 - "$dir/$tag-linux-amd64/mcs51-toolchain.json" "$REVISION" <<'PY'
          import json, sys
          commit = json.load(open(sys.argv[1]))["source"]["commit"]
          assert commit == sys.argv[2], f"toolchain {commit} != pin {sys.argv[2]}"
          PY
          echo "LLVM_TOOLS=$dir/$tag-linux-amd64/bin" >> "$GITHUB_ENV"

      # Runtime, startup and linker script sources of the same revision.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ steps.pin.outputs.repository }}
          ref: ${{ steps.pin.outputs.revision }}
          path: llvm
          fetch-depth: 1
          sparse-checkout: |
            llvm/lib/Target/MCS51
            llvm/test/CodeGen/8051/Inputs
          persist-credentials: false

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install --yes --no-install-recommends python3-pyelftools

      - name: Build firmware
        run: |
          make firmware LLVM_TOOLS="$LLVM_TOOLS" LLVM_SRC="$GITHUB_WORKSPACE/llvm"
          python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import json
          r = json.load(open("build/firmware/receipt.json"))
          m = r["admission"]["measured"]
          print(f"firmware {r['status']}: code {m['code']} B, common {m['common']} B, "
                f"stack {m['stack_demand']} B, hex sha256 {r['hex_sha256']}")
          PY

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flower-cc2530-${{ github.sha }}
          path: |
            build/firmware/firmware.hex
            build/firmware/firmware.elf
            build/firmware/receipt.json
