name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host:
    name: Host tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {submodules: true, persist-credentials: false}
      - run: make test

  firmware:
    name: LLVM MCS-51 firmware
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {submodules: true, persist-credentials: false}

      - name: Read the stack's compiler pin
        id: pin
        run: |
          python3 - >> "$GITHUB_OUTPUT" <<'PY'
          import json
          pin = json.load(open("cc2530-zigbee/tools/llvm/toolchain.json"))
          print("repository=" + pin["repository"])
          print("revision=" + pin["revision"])
          PY

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ steps.pin.outputs.repository }}
          ref: ${{ steps.pin.outputs.revision }}
          path: llvm
          fetch-depth: 1
          persist-credentials: false

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install --yes --no-install-recommends \
            build-essential cmake ninja-build ccache lld python3 python3-pyelftools

      - name: Restore compiler cache
        id: compiler-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-mcs51-${{ runner.os }}-${{ steps.pin.outputs.revision }}
          restore-keys: ccache-mcs51-${{ runner.os }}-

      - name: Build LLVM-MCS51
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
          CCACHE_MAXSIZE: 3G
        run: |
          set -euo pipefail
          cmake -S llvm/llvm -B llvm-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DLLVM_ENABLE_ASSERTIONS=ON \
            -DLLVM_ENABLE_PROJECTS='clang;lld' -DLLVM_TARGETS_TO_BUILD=MCS51 \
            -DLLVM_INCLUDE_TESTS=OFF -DLLVM_INCLUDE_BENCHMARKS=OFF -DLLVM_INCLUDE_EXAMPLES=OFF \
            -DLLVM_ENABLE_ZSTD=OFF -DLLVM_ENABLE_LIBXML2=OFF -DLLVM_ENABLE_LIBEDIT=OFF \
            -DLLVM_CCACHE_BUILD=ON -DLLVM_USE_LINKER=lld -DLLVM_PARALLEL_LINK_JOBS=2
          ninja -C llvm-build clang lld llvm-objcopy llvm-ar llvm-objdump llvm-readobj llc llvm-mc
          ccache --show-stats

      - name: Save compiler cache
        if: steps.compiler-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-mcs51-${{ runner.os }}-${{ steps.pin.outputs.revision }}

      - name: Build firmware
        run: |
          make firmware LLVM_TOOLS="$GITHUB_WORKSPACE/llvm-build/bin" LLVM_SRC="$GITHUB_WORKSPACE/llvm"
          python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import json
          r = json.load(open("build/firmware/receipt.json"))
          m = r["admission"]["measured"]
          print(f"firmware {r['status']}: code {m['code']} B, common {m['common']} B, "
                f"stack {m['stack_demand']} B, hex sha256 {r['hex_sha256']}")
          PY

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flower-cc2530-${{ github.sha }}
          path: |
            build/firmware/firmware.hex
            build/firmware/firmware.elf
            build/firmware/receipt.json
